<!DOCTYPE html>

                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#1e2430", // Slightly lighter for cards

                        "display": ["Inter", "sans-serif"]

                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },

<style>

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .glass-panel {
            background: rgba(30, 36, 48, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);

<style>

<div class="glass-panel px-2 py-1 rounded-full flex items-center gap-1.5 shadow-sm transform -translate-y-5 -translate-x-2">

</div>

<div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-white rounded-br-sm opacity-50"></div>
</div>

</div>
</div>
<div class="shrink-0 flex items-center gap-2">
<div class="h-8 px-3 flex items-center justify-center rounded-lg bg-background-light dark:bg-black/20 border border-slate-200 dark:border-white/5">

</div>
<span class="material-symbols-outlined text-slate-400 text-sm">chevron_right</span>
</div>
</div>
